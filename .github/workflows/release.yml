name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish and package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for rid in osx-arm64 osx-x64 win-x64 win-arm64; do
            dotnet publish DecompilerMCPServer.csproj -c Release -r "$rid" \
              -p:Version="$VERSION" -o "publish/$rid"
            name="DecompilerMCPServer-v${VERSION}-${rid}"
            # Archive exactly the one expected file so a layout change fails loudly
            case "$rid" in
              osx-*) tar -C "publish/$rid" -czf "dist/${name}.tar.gz" DecompilerMCPServer ;;
              win-*) (cd "publish/$rid" && zip -q "$GITHUB_WORKSPACE/dist/${name}.zip" DecompilerMCPServer.exe) ;;
            esac
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -la dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
            *)   PRERELEASE="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
